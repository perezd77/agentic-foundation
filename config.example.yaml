# =============================================================================
# Revolut Share Alerts — configuration template
# -----------------------------------------------------------------------------
# Copy this file to `config.yaml` and edit it with YOUR holdings and levels.
# `config.yaml` is git-ignored so your personal positions stay private.
#
# This tool only READS prices and EMAILS you. It never trades. Decide and act
# in the Revolut app yourself.
# =============================================================================

notifications:
  email:
    enabled: true
    # Where alerts are sent.
    to: you@gmail.com
    # Optional: override the From address / display name. Defaults to GMAIL_USER.
    # from_name: "Share Alerts"
    # SMTP credentials are read from the environment, never stored here:
    #   GMAIL_USER          your gmail address
    #   GMAIL_APP_PASSWORD  a Google "App password" (not your normal password)

defaults:
  # Currency label used in emails when a price source doesn't report one.
  currency: USD
  # Don't re-send the same alert (same ticker + same rule) within this window.
  cooldown_hours: 12

# -----------------------------------------------------------------------------
# Your holdings. Replace these PLACEHOLDERS with the shares you actually own.
# Every field except `ticker` is optional — include only the rules you want.
# -----------------------------------------------------------------------------
holdings:
  - ticker: AAPL                 # Yahoo Finance symbol (see README for suffixes)
    name: Apple Inc.             # optional, shown in the email
    shares: 10                   # optional, used for position-value context
    avg_cost: 180.00             # optional, enables gain_pct / loss_pct rules
    rules:
      sell_above: 240.00         # SELL alert when price >= 240.00 (take profit)
      buy_below: 175.00          # BUY  alert when price <= 175.00 (buy the dip)
      stop_loss: 160.00          # SELL alert when price <= 160.00 (cut losses)
      gain_pct: 25               # SELL alert when up >= 25% vs avg_cost
      loss_pct: 15               # SELL alert when down >= 15% vs avg_cost
      day_move_pct: 6            # heads-up when price swings >= 6% in a day

  - ticker: TSLA
    name: Tesla Inc.
    shares: 5
    avg_cost: 250.00
    rules:
      sell_above: 320.00
      buy_below: 200.00
      stop_loss: 180.00

  # A non-US example: London-listed Vodafone is "VOD.L", priced in GBp (pence).
  - ticker: VOD.L
    name: Vodafone Group
    rules:
      buy_below: 70.00
      sell_above: 90.00
