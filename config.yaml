# =============================================================================
# Revolut Share Alerts — live configuration
# -----------------------------------------------------------------------------
# Stocks being monitored. Price targets below are MECHANICAL STARTERS derived
# from approximate prices on 2026-06-13 (take-profit +15%, buy-the-dip -10%,
# stop-loss -20%, rounded). They are NOT recommendations — tune them to your
# own average cost and risk appetite. Add `avg_cost:` to a holding to also use
# percentage rules (gain_pct / loss_pct).
#
# This file is committed so the scheduled GitHub Actions workflow can run it.
# It contains NO secrets — email credentials come from the environment
# (GMAIL_USER / GMAIL_APP_PASSWORD).
# =============================================================================

notifications:
  email:
    enabled: true
    to: perez.david@gmail.com

defaults:
  currency: USD          # fallback label only; each ticker reports its own
  cooldown_hours: 12

holdings:
  - ticker: MSFT          # Microsoft (NASDAQ, USD) — anchor ~$400
    name: Microsoft
    rules:
      day_move_pct: 5     # heads-up on a >5% daily swing
      sell_above: 460.00  # take-profit
      buy_below: 360.00   # buy-the-dip
      stop_loss: 320.00   # cut-loss floor

  - ticker: OVH.PA        # OVHcloud (Euronext Paris, EUR) — anchor ~EUR 14.85
    name: OVHcloud
    rules:
      day_move_pct: 5
      sell_above: 17.00
      buy_below: 13.50
      stop_loss: 12.00

  - ticker: HO.PA         # Thales (Euronext Paris, EUR) — anchor ~EUR 235 (uncertain)
    name: Thales
    rules:
      day_move_pct: 5
      sell_above: 270.00
      buy_below: 210.00
      stop_loss: 190.00

  - ticker: SAF.PA        # Safran (Euronext Paris, EUR) — anchor ~EUR 300
    name: Safran
    rules:
      day_move_pct: 5
      sell_above: 345.00
      buy_below: 270.00
      stop_loss: 240.00
