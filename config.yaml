# =============================================================================
# Revolut Share Alerts — live configuration
# -----------------------------------------------------------------------------
# Stocks being monitored. Each holding starts with a ±5% daily-move heads-up so
# it is watched immediately; add your own price targets (sell_above / buy_below
# / stop_loss) and avg_cost whenever you want sharper buy/sell signals.
#
# This file is committed so the scheduled GitHub Actions workflow can run it.
# It contains NO secrets — email credentials come from the environment
# (GMAIL_USER / GMAIL_APP_PASSWORD).
# =============================================================================

notifications:
  email:
    enabled: true
    to: perez.david@gmail.com

defaults:
  currency: USD          # fallback label only; each ticker reports its own
  cooldown_hours: 12

holdings:
  - ticker: MSFT          # Microsoft (NASDAQ, USD)
    name: Microsoft
    rules:
      day_move_pct: 5     # heads-up on a >5% daily swing
      # sell_above: 0.00  # take-profit target
      # buy_below: 0.00   # buy-the-dip level
      # stop_loss: 0.00   # cut-loss floor

  - ticker: OVH.PA        # OVHcloud (Euronext Paris, EUR)
    name: OVHcloud
    rules:
      day_move_pct: 5
      # sell_above: 0.00
      # buy_below: 0.00
      # stop_loss: 0.00

  - ticker: HO.PA         # Thales (Euronext Paris, EUR)
    name: Thales
    rules:
      day_move_pct: 5
      # sell_above: 0.00
      # buy_below: 0.00
      # stop_loss: 0.00

  - ticker: SAF.PA        # Safran (Euronext Paris, EUR)
    name: Safran
    rules:
      day_move_pct: 5
      # sell_above: 0.00
      # buy_below: 0.00
      # stop_loss: 0.00
